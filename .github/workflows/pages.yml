name: Publica Tsumige
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --experimental-strip-types --test tests/backup-archive.test.ts
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://swexwdaqqdisbtvzwikv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_W6slvF26oP7zAUBY86Lpsw_mV3TgSsA
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
